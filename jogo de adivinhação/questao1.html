<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Jogo de Adivinhação</h1>

        <p>Qual o número entre <strong>1 e 20</strong>.</p>
        <p>Tente descobrir qual é!</p>

        <input type="number" id="palpite" min="1" max="20" placeholder="Digite seu palpite">

        <button onclick="verificarPalpite()">Adivinhar</button>

        <p id="mensagem"></p>

        <p id="tentativas">Tentativas: 0</p>

        <button class="novo-jogo" onclick="novoJogo()">🔄 Novo Jogo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
